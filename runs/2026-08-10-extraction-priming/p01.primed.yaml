extraction_notes:
  - "PROVENANCE WARNING, and it applies to this whole record. It was written by a Claude Code session that had already read `project-evaluation-issues.md`, the twin catalogue and the owner's live comments, not by `agents/extractor/v1` run in a clean context. The prompt exists and was followed, but it was not the only thing in the room. Two notes below were seeded by owner remarks rather than found by extraction and are marked; the unmarked ones carry the same risk less visibly. Re-running extraction in an isolated context is the only way to know which findings survive, and until that is done no claim here about what an extractor can find is supported."
  - "OWNER-SEEDED, not found by extraction. `problem_statement: specific` is true by the field's definition and misleading as a summary: the stated audience is tourists while the corpus, interface and answers are Portuguese (`corpus_language: pt`). Audience and system are each stated and do not cohere. Recognising that needs world knowledge, not a fact in the repository, so no field captures it and the extractor did not raise it unprompted."
  - "OWNER-SEEDED, and it corrected two field values. `run_instructions_gap_count` was first recorded as 0 from a desk walk-through that checked only whether each documented step had its inputs available. Both real gaps needed tracing a step into the code it invokes: the BM25 index is built once at API startup (src/api/app.py:29-51) so the documented ordering leaves it empty, and deploy/deploy.sh:14 excludes the .env that docs/deployment.md:9 relies on. The check is only as deep as the tracing, and a shallow walk-through returns a confident 0."
  - "`headline_numbers_traceable` was first recorded as `all_traceable` on the reading that an artifact merely had to exist. Both notebooks are non-executable as committed (no imports for the names they use) and marimo stores no outputs, so 18 reported figures have nothing behind them. The schema definition has been tightened: the artifact must be *able to produce* the number. This is the strongest instance in p01 of the claim-without-artifact pattern from `project-evaluation-issues.md` section 4, and the first reading missed it entirely."
  - "`retrieval_eval_config_matches_shipped` collapses three independent differences (retrieval depth, rerank cut-off, query rewriting present or absent) into one enum. The diff is in `basis` but is not machine-readable, so a twin cannot mutate one difference without mutating the field wholesale. Owner-acknowledged at the M1 gate as acceptable for M1; if candidates start distinguishing kinds of drift, this becomes a structured list."
  - "`retrieval_eval_relevance_rule: source_level` records a fact about the scoring function. Whether source-level matching is too coarse *for this corpus* depends on how the 1514 chunks distribute across the four source labels, which is a semantic question the schema deliberately cannot ask. The field records the rule, not its adequacy."
  - "2 of the 27 test-set entries carry `source: none` and are scored as a miss for every strategy at every k (notebooks/01:56-62). Every reported hit rate is therefore about 7% lower than the same measurement over the 25 answerable questions, uniformly across all four strategies — so the table understates absolute performance while leaving the ranking between strategies intact. No schema field can express a systematic offset in a reported number that leaves comparisons valid."
  - "p01 exercises every field group cleanly. That is expected and is not evidence the schema is right: it was derived from this repository, by a session that already knew what to look for. p02 is the first real test, and what the schema fails to say about it is the finding."
