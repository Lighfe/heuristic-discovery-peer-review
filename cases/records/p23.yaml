extraction_notes:
  - "Four fields were forced into a value meant for a different situation because the schema's enums for group D/E don't distinguish 'no evaluation was attempted' from 'an evaluation exists but the question is unresolvable': retrieval_eval_config_matches_shipped, llm_eval_config_matches_shipped, retrieval_best_approach_shipped and llm_eval_role_overlap are all recorded as undeterminable here, but for the reason 'there is nothing to compare', not 'the evidence is absent or contradictory' as the schema's own definition of undeterminable states."
  - "retrieval_eval_reproducible and llm_eval_reproducible have no undeterminable option at all; recorded as neither because no pipeline exists, but that collapses 'no evaluation was ever attempted' together with 'an evaluation was attempted and is broken', which are different facts a candidate might want to score differently."
  - "query_rewriting is ambiguous for this repository's shape: the agent is tool-calling (pydantic_ai), so the LLM itself composes the search_lore query string at call time, and may call it more than once with a different query while reasoning. No dedicated rewriting/reformulation module exists in code, so present is recorded false, but an agentic system blurs the line between 'a technique was implemented' and 'the model's ordinary tool-use produces the same effect'."
  - "The .dockerignore lists CLAUDE.md, TECH_DEBT.md and project.md as excluded from the image, but none of the three are tracked by git at the pinned commit (git ls-files returns 20 files, none of them these). Not used as evidence for anything; noted since it implies local-only files existed during development that are not part of the record."
  - "README.md:60's 'cd rpg_bartender_project' step could not be checked against the actual repository name, since that name is deliberately not recorded by this project's anonymity rule; not counted as a run_instructions gap because it may simply be a placeholder in the Quick start block."
  - "llm_provider is recorded as the single string 'openai' (the .env.example default and the only key without a comment marking it optional), though OPENROUTER_API_KEY/openrouter: model prefixes are a documented alternative; the schema's free-text single-value field has nowhere to record a second supported provider."
