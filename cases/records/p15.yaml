extraction_notes:
  - "The README/USAGE prose describes hybrid search and query rewriting only as pipeline steps ('combines hybrid search... with an LLM', 'automatically rewrites queries to improve retrieval'), with no stated ship/do-not-ship argument. I read this as decision_basis: none rather than argued, since nothing compares the choice against an alternative; a stated purpose alone reads differently from a stated justification, and the schema does not draw this line explicitly."
  - "hybrid_search.measured_effect is ambiguous under the current definition when three approaches are compared pairwise and disagree by baseline rather than by metric: hybrid beats text-only on both hit_rate and mrr, but loses to vector-only on both hit_rate and mrr. The schema's 'mixed' is defined as metrics disagreeing with each other for one comparison, not as comparisons disagreeing with each other against different baselines. I recorded mixed as the closest fit and flag this as a possible schema gap when more than two approaches exist."
  - "src/ingest.py's build_index and build_vector_index both use the pattern `if index: return index else: index.fit(...)`, where `index` is a freshly constructed object — under ordinary Python truthiness this branch always returns before .fit() runs, unless the sqlitesearch library's index classes define custom `__bool__`/`__len__` that evaluate falsy when empty. That library is an installed dependency, not vendored in this repository, so I could not verify which is true from committed code alone, and I did not run or install anything to check. Left undetermined rather than asserted as a run_instructions_gap; flagged here as a candidate for owner or library-source review."
  - "notebooks/010-agent-evals.ipynb runs a tool-calling agent harness (via the toyaikit package) distinct from the shipped RAGProduction chain and from the evaluation.py judge pipeline; it produces one example run with no aggregate metric, so it does not count toward llm_eval_approaches_compared or any other scoreable field, but it is a third, uncounted evaluation-adjacent artifact worth noting for schema completeness."
  - "data/clinical_eval_set.csv is a second, differently-prompted question set (notebooks/03-clinical-data-gen.ipynb) used only in the embedding-model and vector-mode tournament notebooks (04, 05), not in the core hit_rate/mrr/judge evaluations that produce the numbers cited above. The schema's artifact_reference_strength/artifacts_unreferenced_count checklist treats 'evaluation question set' as one category; README.md:242 names clinical_eval_set.csv but never names data/ground_truth.csv, the file the reported hit_rate/mrr/good-rate figures actually come from. Category-level, this reads as referenced; file-level, the specific evidentiary artifact is unreferenced. Recorded as a note since the schema checklist operates at category granularity."
  - "The git history's single commit is authored under a name that appears in the clone's local git log metadata, not in any tracked file path; nothing in the tracked file tree names a person, so no evidence field or note here cites it."
