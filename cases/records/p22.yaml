extraction_notes:
- 'query_rewriting: a term-extraction step exists (src/rag.py extract_keywords_from_design_doc), but it feeds a keyword list to the external data-fetch/ingestion call, not a rewritten query passed into the retrieval function — src/search.py''s search_prior_art always embeds and searches the original input text unmodified. Recorded present:false on the reading that this schema''s ''query rewriting'' concerns the retrieval-time query, not an ingestion-time term extraction; flagged because the schema does not state this distinction explicitly and a different extractor could read it the other way.'
- retrieval_eval_approaches_compared counts 3 because three strategies are reported with numeric figures in prose documents, per the field's literal definition ('distinct strategies with reported numbers'). That count is disjoint from headline_numbers_traceable/untraceable_number_count, which record that only 1 of those 3 has any committed code producing it. A reader relying on retrieval_eval_approaches_compared alone would not see this gap.
- 'retrieval_eval_reproducible: judged ''neither'' rather than ''traceable_not_reproducible'' because the group-D definition asks about ''the retrieval-evaluation pipeline'' as a whole and two of the three reported rows have zero committed producing artifact (not merely non-reproducible, but non-traceable — there is nothing to inspect). If a stricter reading confines this field to whatever single script exists (src/eval.py) and ignores rows no script attempts, ''traceable_not_reproducible'' would be the alternative answer, since that script''s steps are inspectable even though its primary data path is an uncommitted live external call. Recording both readings since the schema does not resolve which scope this field takes when a report exceeds what any single script attempts.'
- 'run_instructions_gap_count: the gap found (src/search.py:8-15''s ingestion trigger is gated on the primary backing store having failed to connect) is structurally the same class of gap the schema''s own worked example describes for a different repository (schema.md group G) — found only by tracing a documented step into the code it calls, not visible from the documentation alone.'
- 'problem_statement judgment: audience and question are both named (README.md:31-43) but the schema itself flags this field''s check as the one judgment call in the schema; recorded ''specific'' on a literal reading of ''named'' rather than any view on strength or coherence of the stated audience/question pairing.'
- 'untraceable_number_count: the schema specifies counting individual figures, not rows or claims, but does not specify how to treat a figure repeated verbatim across two documents. This record counts each distinct fact once rather than once per on-page occurrence; a different convention (counting every occurrence in every document) would roughly double the figures that appear in both README.md and evaluation_results.md.'
- No file path, evidence string, or basis in this record names the repository, its owner, or any contributor.
