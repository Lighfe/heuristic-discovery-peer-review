extraction_notes:
- 'retrieval_eval_relevance_rule: the schema''s source_level vs document_level distinction is ambiguous for this repository. Each corpus record is a whole paper abstract (no distinct notion of ''source'' separate from ''document''), and the vector-search chunks still carry the parent document''s id for matching. I read the check as document_level; a reader who considers ''document'' and ''source'' identical here might instead read it as source_level.'
- 'retrieval_eval_approaches_compared / headline_numbers_traceable: README''s retrieval table reports a second embedding model (gte-base, Xenova/gte-base) with hit rate 0.692 / MRR 0.556, but no cell in notebooks/notebook.ipynb runs or references gte-base anywhere — only the MiniLM embedder (src/embedder.py, models/Xenova/all-MiniLM-L6-v2) is instantiated. The README''s hybrid row is also reported as a range (0.835-0.839 hit rate) whose upper bound is not reproduced by any committed cell (committed hybrid cell output is the single value 0.835); it may derive from a gte-base-based hybrid run, but this is not stated and I did not count it as an additional untraceable figure given that ambiguity.'
- 'A generator/artifact mismatch that did not fit any J field cleanly: notebooks/notebook.ipynb:cell17''s data_gen_instructions2 prompt asks for ''exactly 2 distinct questions'' per document, but the ground-truth file actually used by the evaluation (data/ground_truth_dataset_5_doc.csv) has 2955 rows over 591 documents — exactly 5 per document, not 2. A second, unused file (data/ground_truth_dataset_2_doc.csv, also committed) does have a 2-per-document density consistent with the visible prompt. Since only one version of the generator prompt is committed, and the actual generation call in cell 28/29 that would have produced the 5-per-document file is commented out, the pipeline that produced the file actually used by the evaluation is not reconstructable from what''s committed. This is a fact about provenance/reproducibility, not a claim-vs-code contradiction as document_code_conflicts is defined, and not a two-document disagreement as document_number_conflicts is defined — the schema has no field for ''committed artifact whose own generation process cannot be traced to the code that would produce it.'''
- 'interface_kind: the notebook (notebooks/notebook.ipynb:cell14-15) also exposes a callable rag(query) that returns an answer, functionally a second way to query the system, but the README frames the notebook exclusively as an ''optional'' evaluation/exploration artifact, never as a usage interface. I did not include script_or_notebook in interface_kind on that basis, but the distinction between ''the notebook happens to expose a query function'' and ''the notebook is documented as an interface'' is not something the schema''s enum can express.'
- 'containerization_kind: compose_full vs compose_dependencies_only is ambiguous when the application itself has no external service dependencies (this repo''s retrieval index is in-memory, no separate DB/vector-store container). docker-compose.yml here only wraps the single app container. I chose compose_full since one compose command is sufficient to run the complete, working system, but the definitions as written assume a project with external dependencies to distinguish the two values.'
- This extraction did not read any file outside clones/p16, cases/schema.md, and agents/extractor/v2/prompt.md, and did not execute, install, or invoke any interpreter or package manager belonging to the target repository.
