extraction_notes:
  - "retrieval_eval_reproducible / headline_numbers_traceable interaction: the reported retrieval comparison has one arm that is fully committed-and-runnable and one arm that is only reconstructable by substituting a different, already-committed function into the same evaluation harness by hand. The current three-way enum has no value for 'reproducible for the shipped approach, merely traceable for the comparison baseline that justified the choice'; I recorded the whole-pipeline value as traceable_not_reproducible and used untraceable_number_count/headline_numbers_traceable to carry the finer distinction, but a reader relying on retrieval_eval_reproducible alone would not see that half of the pipeline is actually reproducible_as_committed."
  - "llm_eval_approaches_compared: this repository's answer evaluation produces only a live database aggregate (visible in an admin view), never a static reported number in any committed document, unlike the retrieval-evaluation table. I counted the one existing judged configuration as 1, but the field's phrase 'with reported numbers' is ambiguous when the only aggregation is computed on demand from a database rather than committed as a document or results file. This same fact is why llm_eval_metric_at_ceiling is null here, consistent with that field's own definition."
  - "run_instructions_gap_count: the one gap found (evaluation step assumes prior conversation records that the procedure never instructs the reader to create) does not make any command error or crash — it silently produces an empty result. The schema counts this the same as a hard failure (a command that cannot be carried out as written), but the two are different reader experiences and the field cannot distinguish them."
  - "A code comment in src/germany_decoded/db/init.py:6 names a different sentence-embedding model than the one actually loaded in src/germany_decoded/embeddings.py:4. This is a code-comment-vs-code discrepancy, not a documentation-vs-code one, so it does not fit document_code_conflicts as defined (that field's examples are all prose-document claims contradicted by code). General software knowledge — that the model actually loaded is also known to produce 384-dimensional output, matching the committed VECTOR(384) column — was load-bearing in concluding this is a stale comment rather than a functional defect; I did not run anything to check it."
  - "corpus_language: this repository ingests source documents in one language and answers exclusively in another, by design (the stated purpose is making one language's legal texts accessible to speakers of the other). I recorded the language of the ingested knowledge-base text, since 'corpus' reads most naturally as the ingested material rather than the interface. The field does not say which reading governs, and this repository is the sharpest case for the ambiguity: a criterion or reader could reasonably want either answer, and they differ here."
