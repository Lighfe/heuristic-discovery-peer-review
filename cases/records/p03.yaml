extraction_notes:
- 'reranking (group H): README''s tech-stack list labels the RRF fusion step ''Ranking'' (README.md:41), which could be misread as this schema''s ''reranking'' technique. It was recorded as absent here because RRF is the fusion mechanism inherent to hybrid_search (combining the two sub-search result lists), not a separate re-ranking stage (e.g. a cross-encoder) applied afterward. The naming overlap is worth flagging for anyone reading `present: false` on this field against the README''s own vocabulary.'
- 'llm_eval_approaches_compared (group E): the field asks about distinct prompts/models, and this repository holds that fixed — one prompt template, one model — across every judged answer. What the committed notebooks actually vary is retrieval *source* (vector-only vs text/BM25-only), each judged separately with separately reported relevance counts. That variation is real and evidenced (see llm_eval_role_overlap and llm_eval_config_matches_shipped basis) but has no field to land in under group E; group D''s retrieval_eval_approaches_compared covers a different comparison (retrieval metrics, not judge relevance).'
- 'README.md:88 states the second dataset''s judge result as ''20 RELEVANT, 0 PARTLY, 1 NON_RELEVANT''. The committed notebook (notebooks/03_llm_judge_Zaratustra.ipynb:cell16) reports this as two separate rows: a text-sourced row matching those exact counts, and a vector-sourced row with worse counts (2 NON_RELEVANT, 1 PARTLY_RELEVANT, 18 RELEVANT of 21) that the README does not mention at all. The reported figure is traceable (a committed artifact does produce it), so this does not lower headline_numbers_traceable, but it is a selective-reporting fact with no field to record: not document_number_conflicts (only one document states figures) and not document_code_conflicts (the code corroborates the stated row rather than contradicting it, it just also contains an unstated second row).'
- 'Committed but apparently orphaned artifacts: data/ground_truth/avreli_razmyshlenia_cleaned.json, data/processed/avreli_razmyshlenia_chunks.pkl, data/evaluation/avreli_razmyshlenia_llm_judge_.csv and data/evaluation/avreli_razmyshlenia_llm_judge_text.csv are not read or written by any committed .py or .ipynb file found by a repo-wide search. No group-J field covers ''committed files nothing points at from code'' — artifacts_unreferenced_count is scoped to a fixed checklist of expected-artifact kinds and checks documentation references, not code references to arbitrary committed files.'
- rag.py:304-305 defines a get_answer(query, search_index, ...) wrapper that instantiates RAGPipeline(search_index) with a single positional argument, but RAGPipeline.__init__ (rag.py:80-88) requires both search_index and text_index. This wrapper is not called by app.py (which constructs RAGPipeline(vindex, tindex) directly) or referenced in documentation, so it was not scored as a document_code_conflict; recorded here as ordinary software knowledge (a missing required positional argument) that is load-bearing for noting the function is dead/broken code, per the extractor prompt's rule on general programming knowledge.
- 'data_accessible / run_instructions interaction: data/processed/knowledge_base.pkl (the artifact `make prepare` produces) is already committed, and docker-compose.yaml bind-mounts the repository''s own data/ directory into both containers. This means `make up` alone, without first running `make prepare`, would use the already-committed processed data — the Quick Start''s numbered step order (README.md:108-134) does not make this optionality explicit, though it does not by itself constitute a run_instructions gap under the schema''s definition, since no named step fails or is unreachable.'
- 'problem_statement (group A) is flagged in cases/schema.md itself as the weakest field, checking only that an audience and a question are both *stated*, not that they cohere. Not re-litigated here beyond noting the same shape of split applies: the stated audience (people under modern stress) is broad and general, distinct from the corpus''s specific personas (group K, descriptive) — the field does not ask whether those two align.'
