extraction_notes:
  - "Group H reminder followed: every hybrid_search/reranking/query_rewriting sub-field below is written as its own {value, evidence, basis} mapping nested under the technique name, never a bare value."
  - "Schema does not state whether a `false` boolean requires a nonempty `evidence` list when the fact is an absence (llm_eval_judge_spotchecked, reranking/query_rewriting present, hybrid_search shipped_enabled, measured_effect: not_measured). I resolved this by citing the location that would carry the positive fact if it existed (a README line, or the file/script that would contain the missing step), rather than leaving evidence empty, consistent with the schema's rule that empty evidence means only `undeterminable`. Flagging this as a formatting choice rather than a specified convention."
  - "scripts/download_docs.py has a structural bug: the git clone/sparse-checkout/checkout subprocess calls are indented one level less than the inner per-version loop, so they execute once per library using the last-iterated version's target_dir/url rather than once per version. This is verifiable purely by reading the script's indentation; its downstream effect (only the latest version's docs ever get cloned) is independently confirmed by counting (library, version) pairs in the committed data/processed/chunks.json, which contains zero 'pydantic'/'v1' or 'sqlalchemy'/'v1.4' chunks despite both being named in docs/setup.md's pipeline description. Recorded under document_code_conflicts (group J) since it is the sharpest field for it, but the underlying fact (a project whose stated purpose is version-to-version migration assistance ships a knowledge base missing the 'from' version for two of its three libraries) is larger than that one count and is noted here for visibility."
  - "data/evaluation/rag_answers.csv and version_compliance_evaluations.csv (500 rows each) contain 250 questions that do not appear in the currently committed data/evaluation/ground_truth.csv (250 rows) -- apparently orphaned from an earlier ground-truth generation. This drove llm_eval_reproducible to traceable_not_reproducible rather than reproducible_as_committed; recorded here since the schema has no single field naming a mismatch between two committed evaluation artifacts directly (it is not `document_number_conflicts`, since no two documents state disagreeing figures -- one artifact simply contains rows absent from the other)."
  - "problem_statement is the schema's flagged weakest field (judgment-based). I read 'specific' from the README title line plus the Problem section stating both the question (how to migrate code across major framework versions) and the audience (developers doing such upgrades); noting the call per the schema's own guidance to record disagreement here rather than adjust the field's definition."
  - "interface_kind was scoped to app.py only (web_ui); dashboard.py's Streamlit UI was treated as belonging to the monitoring fields (group F) rather than as a second interface, since it is a telemetry viewer rather than a way to perform the system's core task. Flagging this scoping choice as a judgment call the schema does not resolve explicitly."
  - "Did not execute or install anything from the repository; all findings (including the download_docs.py loop-indentation bug and the requires-python/Dockerfile mismatch) are read directly from committed source and committed data files. The requires-python vs. Dockerfile-base-image conflict's practical consequence (a failing `uv pip install -r pyproject.toml` under Python 3.12) is inferred from ordinary uv/packaging behavior (uv enforces requires-python against the invoking interpreter), not from running it -- flagged per the schema's rule that load-bearing general software knowledge be named explicitly."
