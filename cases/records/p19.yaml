extraction_notes:
  - "document_number_conflicts and headline_numbers_traceable/untraceable_number_count were both filled from the same underlying fact (docs/usage.md's Hit Rate/MRR table vs. the committed data/evaluation_results.csv). The schema's own group-J text (p01's ceiling case, p02's dropped-null case) treats these as answering different questions about the same repository, so both were recorded rather than choosing one; document_code_conflicts was left at 0 to avoid a third counting of the identical fact, since the disagreement is between two documents (a markdown table and a CSV artifact), not between a document and application code behavior."
  - "hybrid_search's measured_effect does not fit the four-value enum cleanly: hybrid ties vector-only exactly on both reported metrics (no cross-metric disagreement, so not 'mixed' by the letter of its definition) but also shows no improvement over the simpler baseline (so 'improves' overstates it). Recorded as 'mixed' as the closest available value; a value distinct from cross-metric disagreement for 'ties the next-simplest baseline' would be worth proposing."
  - "llm_eval_question_generator and llm_eval_role_overlap assume the answer-evaluation pipeline runs over a fixed, generated question set the way the retrieval evaluation does. This project's judge instead evaluates whatever question a live user submits to /ask; a generator (generate_ground_truth.py) exists in the repo but feeds only the retrieval evaluation, not the judge. Recorded llm_eval_question_generator as none_committed for the judge specifically, and noted the mismatch here rather than crediting an unrelated generator."
  - "retrieval_eval_relevance_rule was recorded as document_level rather than source_level: each ingested unit is one whole FAQ character-class record with no further chunking, and the match is exact-doc_id equality, so 'document' and 'source' are the same granularity here. The schema's prose does not define the boundary between the two values precisely enough to rule out source_level as an equally defensible reading."
  - "src/bg_rag/frontend/app.py's sidebar links to './dashboard' (app.py:103) as if the metrics dashboard were a page within the same Streamlit app (port 8501), but the dashboard is actually a separate Streamlit process on a different port (Makefile 'dev-dashboard' target, port 8502). Following that in-app link would not reach the dashboard. This is a structural, checkable fact, but no schema field covers a broken reference inside application UI code as opposed to inside documentation (broken_reference_count and artifact_reference_strength are documentation-scoped); recorded here rather than forced into either field."
  - "llm_eval_reproducible was scored 'reproducible_as_committed' on the narrow question of whether the judge pipeline's code would run as committed. No committed artifact aggregates judge verdicts into a reported number at all (hence llm_eval_metric_at_ceiling: null), so 'reproducible' here says only that the mechanism works, not that any figure can be regenerated — the schema's three-value enum for this field has no option for 'no aggregate exists to reproduce', unlike llm_eval_metric_at_ceiling which does."
