extraction_notes:
  - "llm_eval_question_generator has no enum value for a mixed-provenance question set (part committed-generator-tied-to-passage, part hand-typed with no generator trace). Recorded as `other`; this looks like a real schema gap given run_answers.py explicitly documents combining a generated set with a hand-authored supplement."
  - "The repository references two files, reports.md and decisionlog.md, dozens of times as the primary evidentiary backing for several headline claims (0.946/0.879 citation precision, the AI-reviewer cross-check numbers). reports.md's non-committal is explained by an explicit, commented .gitignore entry ('local-only orchestration file, never committed'); decisionlog.md is mentioned in a nearby comment but has no .gitignore entry of its own and was not found anywhere in the repository. Both are, from a reader-of-the-repo's standpoint, unreachable regardless of the difference in disclosure."
  - "The one committed generation-phase evaluation report (data/eval/generation-evaluation-report.md, 496 claims, precision 0.869) does not match either headline number the README reports (481 claims; 0.879 v1 or 0.946 v2). The evaluate_generation.py `--judge-version` flag's own code comment describes exactly this kind of stale/mismatched-rubric artifact as a known past failure mode, which is consistent with what's committed here, but I could not confirm from the repository alone whether this specific file is that stale artifact or a different partial run."
  - "For H group query_rewriting, ADR-0017 was written and the ship decision was made using significance thresholds framed as CI-overlap-is-noise; I recorded measured_effect as `mixed` because the two committed reports disagree in point-estimate direction (regression set negative, adversarial set positive), even though the project's own text calls the result a 'genuine near-null.' A criterion reading measured_effect alone would not see the 'near-null, not just direction-disagreeing' framing."
  - "Did not read any file outside agents/extractor/v2/prompt.md, cases/schema.md, and clones/p14/ for this extraction."
