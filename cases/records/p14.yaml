fields:

  # --- A. System shape ---
  knowledge_base_present:
    value: present
    evidence: ["corpus/sources/accessnow.yaml", "src/retrieval/embed.py"]
    basis: "a committed corpus (corpus/sources/*.yaml, data/chunks built by ingestion) is embedded into a retrieval index"
  llm_in_flow:
    value: present
    evidence: ["src/generation/generate.py:321-328"]
    basis: "answer() makes an OpenAI chat.completions.create call on the request path"
  retrieval_flow:
    value: kb_and_llm
    evidence: ["src/generation/generate.py:301", "src/generation/generate.py:321-328"]
    basis: "answer() calls search() against the knowledge base then calls the LLM with retrieved chunks"
  problem_statement:
    value: specific
    evidence: ["README.md:12-18", "README.md:49-58"]
    basis: "README states the question (cross-referencing censorship/digital-rights reporting across orgs) and the audience (researchers, journalists, civic-tech practitioners) in a named section"

  # --- B. Interface ---
  interface_kind:
    value: [web_ui]
    evidence: ["src/interface/app.py:18-278"]
