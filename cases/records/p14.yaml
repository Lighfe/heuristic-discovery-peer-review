  retrieval_eval_relevance_rule:
    value: passage_level
    evidence: ["src/retrieval/evaluate.py:175-182"]
    basis: "a hit is scored when a retrieved chunk_id equals the single labeled correct_chunk_id (one committed chunk, i.e. passage), not a document- or source-level match"
  retrieval_eval_config_matches_shipped:
    value: differs
    evidence: ["src/generation/generate.py:298-301", "src/retrieval/evaluate.py:166-170"]
    basis: "the shipped request path (generate.answer()) runs every query through rewrite_query() before search(); evaluate.py's hit_rate_and_mrr() feeds q['question'] to search() directly, with no rewrite step — top_k, method, and rrf_k default otherwise match"
