extraction_notes:
- interface_framework is typed as a single string but this repository ships two interface frameworks (Flask for the API, Streamlit for the UI), the same one-value-per-project assumption that interface_kind was widened to a list to fix in M2. Recorded both, comma-joined; a criterion reading this field naively would see only whichever half a parser takes first.
- vector_store presumes an embedding-based store (its own examples are qdrant, elasticsearch, in_memory). This project's retrieval is purely lexical — minsearch, a BM25/TF-IDF-style index — and has no embedding component anywhere in the codebase. Recorded the library name as the closest available fact; a project with genuinely no vector component has no clean value for this field.
- 'retrieval_eval_approaches_compared: the repository compares one retrieval method at three top-k cutoffs (3/5/10), not distinct retrieval strategies. The field''s definition (''distinct strategies with reported numbers'') does not say whether a k-sweep of one method counts as one approach or as many; recorded 1 (one method) rather than 3 (three configurations). This is a schema-fit question, not a confident reading.'
- limitations_section is a borderline call here. The README's Future Improvements section (README.md:242-250) names concrete gaps in the current method — no hybrid search, a simple keyword-overlap reranker rather than 'advanced reranking models' — but frames them as future work, not as a stated limitation of what was shipped. Recorded absent on the literal reading; a schema or criterion treating forward-looking gap admissions as equivalent to limitations would read this repository differently.
- 'monitoring_instrumentation: the enum''s two non-none values are illustrated in the schema only by a span/trace example (OpenTelemetry). This repository''s request-time behavior is a synchronous SQLite row insert inside the /ask handler — genuinely on the request path, but not tracing in the span sense either value''s illustration assumes. Recorded logged as the better fit of the two, but the field does not cleanly distinguish ''runs during serving but is a plain write'' from ''runs during serving and is a trace.'''
- 'monitoring_dashboard_provenance: recorded stock_tool_ui because no Grafana provisioning, datasource, or dashboard JSON is committed. Unlike the schema''s own stock_tool_ui illustration (a stock image whose UI shows request traces automatically), a Grafana+SQLite dashboard as pictured in the README screenshot requires manual runtime configuration (a SQLite plugin, hand-built panels) that this repository documents nowhere and that leaves no trace in git either way. The screenshot is the only evidence such a dashboard ever existed.'
- 'Load-bearing general knowledge: `df, index = ingest()` at src/rag.py:6 runs at import time, so importing src.rag (which app.py and the Streamlit page both do transitively) executes ingestion immediately; this is why the missing recipes_documents.csv is a run_instructions gap rather than merely an ingestion-step gap. Also load-bearing: Grafana OSS has no built-in SQLite data source or default dashboards without an installed plugin and provisioning files, neither of which is present, which is what makes the README''s ''Grafana dashboard is connected to the database'' claim unverifiable from the repository alone.'
- 'A documentation-internal contradiction has no field to record it in: README''s Features list states ''Streamlit User Interface'' as already built (README.md:41), while Future Improvements lists ''Build a user-friendly web interface using Streamlit'' as unbuilt future work (README.md:247) — even though streamlit_app.py is committed and working code. document_number_conflicts only covers figures and document_code_conflicts only covers code-contradicts-claim; neither covers a claim contradicting another claim in the same document. Not counted anywhere.'
- 'src/llm.py:17 prints ''Using model: gemini-flash-latest'' as a log message immediately before calling model=''gemini-3.1-flash-lite'' on the next line — the logged model name never matches the model actually called. This is a code-internal inconsistency, not a documentation claim, so it does not fit document_code_conflicts; noted here rather than silently dropped.'
- bash.exe.stackdump and images/desktop.ini are committed Windows/Git-Bash crash and folder-metadata artifacts with no bearing on any field; noted only so their presence in repo_file_count's denominator is not mysterious.
