extraction_notes:
  - "llm_eval_present is a judgment call the schema does not disambiguate: this repository has a working model-judge (monitoring/judge.py) but it is wired only into the live per-conversation monitoring path (monitoring/app.py), never into an offline batch run against the committed ground-truth set with a reported aggregate. evaluation/02_rag_evaluation.ipynb generates agent answers for all 170 ground-truth questions but never calls the judge or computes any metric. Recorded present=true because the judging mechanism and an answer-generation pass over the eval set both exist, but this is a genuinely different shape of 'answer evaluation' than p01/p02 and the schema has no field to say so directly."
  - "The notebook's own markdown documentation (evaluation/01_ground_truth_and_search_eval.ipynb, cells 0 and 8) claims ground-truth generation uses 'a plain OpenAI client, separate from the Groq client the app uses' — but the code cell immediately below configures GROQ_API_KEY and Groq's base_url, identical to the production client. This directly undermines the intended separation between question-generator and answer-generator/judge that llm_eval_role_overlap exists to check, and is itself a document/code conflict (recorded in document_code_conflicts) that a reader following only the markdown would miss."
  - "ingest.py is committed and documented as the ingestion entry point but contains only a load_faq_data() function with no __main__ block; running it as documented does nothing. The actual index build happens as a side effect of the first Retriever() instantiation (in retriever.py, triggered by config.py). This makes group C's ingestion_single_command (a command is documented) and group G's run_instructions_gap_count (the documented command doesn't work) both true of the same fact from two different angles — the schema has no field connecting them."
  - "data/studygrid_faq_bilingual.json (33 entries) and data/studygrid_faq.json (34 entries, the shipped default) differ in document count; the bilingual file is only read by the legacy/unused notebooks/legacy_rag_notebook.ipynb, not by the shipped ingestion path. Noted for context; no scoreable field reads this."
  - "The repository contains an empty tracked path .agents/skills/developing-with-streamlit (0 bytes, no files under it) — not investigated further as it carries no evidentiary content for any field."
