extraction_notes:
  - "monitoring_dashboard_provenance's enum (none/committed_definitions/stock_tool_ui/other) has no clean slot for this repository's case: a Grafana dashboard whose panels are visibly custom-built against the app's own schema (not an out-of-the-box vendor UI) but whose definition is not committed at all, so the only available evidence is a screenshot rather than a text or code locator. Recorded as `other`; the schema may want a fourth value for 'custom, uncommitted' distinct from `stock_tool_ui`."
  - "Load-bearing general-programming fact for retrieval_eval_reproducible: college_rag/ingest.py:163 defines load_documents(data) with no default for its one parameter; college_rag/evaluating.ipynb:cell11 calls load_documents() with zero arguments, which raises TypeError on a fresh top-to-bottom run. This is ordinary Python calling-convention knowledge, not domain knowledge about the subject matter."
  - "Load-bearing general-programming fact for llm_eval_config_matches_shipped and llm_eval_reproducible: Python's str.format() raises KeyError when its template contains a literal brace pair that looks like a field reference but is not escaped as {{ }}. college_rag/evaluat_with_llm.ipynb:cell0's prompt_template has unescaped braces around its JSON example, which is why cell7/cell8 error on the very first sample; app_assist.py:64-67 escapes the same JSON example correctly and runs live in production. This is a fact about Python string formatting, not about the RAG system's subject matter."
  - "document_code_conflicts (README.md:19-25 vs college_rag/ingest.py:155-161): README states the 30-record knowledge base is stored in ground-truth-retrieval.csv; that file is actually the 60-row evaluation question set, and the true knowledge base is us_top_30_universities.json, never named in README."
  - "run_instructions is recorded as `none` because the check is anchored to what a reader following the documentation would find: database/Makefile documents real setup commands for postgres and grafana, but README never names or points at it, and no documentation anywhere states how to install dependencies, set required environment variables (OPENAI_API_KEY, POSTGRES_*), or start the application. The schema does not have a way to record 'runnable instructions exist in the repository but are not linked from the documentation', which is a different fact from both `none` (nothing exists) and `partial` (some documented steps are incomplete)."
  - "run_instructions_gap_count is recorded as 0 alongside run_instructions: none. This is a vacuous zero (no documented steps to fail), which the schema's int type cannot distinguish from a genuinely complete, gap-free documented procedure. The two cases are opposite in what they say about the repository but currently produce the same count."
  - "This repository's most notable retrieval-technique decision — measuring two whole retrieval backends (a text/minsearch index and a dense-embedding index) against each other and shipping the empirically better one — has no home in group H, because hybrid_search/reranking/query_rewriting all describe augmentations to a single retrieval path, not a choice between two competing backends. retrieval_best_approach_shipped captures the outcome, but the schema has no field for 'two whole approaches compared, one shipped', which is exactly the discipline the current criteria's checkbox-for-presence incentive fails to reward."
  - "problem_statement's judgment call: README names the topic (a RAG app for college recommendations) but no named section states an audience; the audience is only visible in code (app.py's chat caption, rag_help.py's system instructions), which this schema's rule 1 treats as available to a reader but not as 'a named section' of documentation. Recorded as `brief`."
