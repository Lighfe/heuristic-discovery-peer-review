extraction_notes:
  - "interface_evidence_kind's enum (none/code_only/code_and_screenshot/code_and_recording) has no slot for a live, runnable public demo URL (README.md:9, tripsync.streamlit.app), which is stronger reviewer-facing evidence than a screenshot but isn't a repository artifact either. Recorded as code_only per the letter of the field; the live-demo fact is noted here rather than invented into the enum."
  - "llm_eval_role_overlap's three roles (question generator, system under comparison, judge) don't cleanly fit this project: the question generator is none_committed (static fixture files) and the judge is offline_metric (deterministic code, not a model), so only one model role exists at all (the answer generator, compared across two named models). same_model was chosen as the closest fit to 'no distinct judge model to overlap with', but the field's intended failure mode (one model occupying several roles) doesn't really apply here — there's no circularity risk since nothing but the generator is a model."
  - "retrieval_eval_relevance_rule choice between document_level and human_labelled was ambiguous: the code path checks exact document(activity)-ID membership (document_level, the coding-level fact), while the case labels also read as curated/human-selected ground truth (human_labelled, a provenance fact). Chose document_level per the instruction to read the rule off the scoring function rather than the label's provenance; flagging in case a future extractor reads this differently."
  - "The catalog curation tag vocabulary in docs/curation-standard.md is not enforced anywhere in code (src/models.py's Activity.interests accepts any normalized string) — a documented convention with no structural check. No schema field currently captures 'documented controlled vocabulary not code-enforced'; noted here rather than forced into an existing field."
