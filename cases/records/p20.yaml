extraction_notes:
- 'retrieval_eval_relevance_rule is finer than ''document_level'': doc_id is a section-level chunk id, and ground truth is generated per chunk, so a hit requires matching the exact source passage, not merely the right species article. Recorded as passage_level.'
- 'The compose stack''s app service has no readiness dependency on Postgres beyond depends_on''s container-start ordering (no healthcheck/condition: service_healthy in docker-compose.yml), so a first ''docker compose up'' could race app startup against Postgres accepting connections. This is timing-dependent rather than a deterministic failure like the no-Docker gap counted above, so it was not added to run_instructions_gap_count, but it is a structural fact about docker-compose.yml worth flagging.'
- llm_eval_metric_at_ceiling's schema example (faithfulness out of 5) assumes a per-item quality score exists. This repository's answer evaluation is a pairwise A/B win-rate between two prompt variants, which has no single best-possible per-item value to check for ceiling against. Recorded as null; a schema note in case other repos have this same eval shape and the field's applicability to A/B designs needs clarifying.
- vector_store records 'qdrant' as the shipped/default backend; minsearch is also implemented and is one of the three approaches compared in retrieval_eval, but the field's example values suggest a single shipped answer is wanted.
