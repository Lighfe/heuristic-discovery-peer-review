extraction_notes:
- LICENSE:3 contains a person-identifying name in its copyright line; not reproduced in this record per the anonymity rule. Flagging for owner review, the same way a person-bearing file path would be flagged.
- 'A stored Jupyter notebook output (test_data_ingestion.ipynb, cell 6) contains a local filesystem path that appears to embed the same person-identifying string as LICENSE:3, inside a library warning captured when the cell was originally run. Not reproduced here for the same reason. This is a second, independent leak surface the anonymity rule as written does not name (it only discusses file paths and contributor names, not incidentally-captured cell output), worth a schema-adjacent process note: notebook outputs can carry local-machine paths that leak identity even when the code itself is clean.'
- With retrieval_eval_present and llm_eval_present both false, several downstream enum fields (retrieval_eval_config_matches_shipped, retrieval_best_approach_shipped, llm_eval_role_overlap, llm_eval_config_matches_shipped) have no value that means 'the question does not apply because the evaluation this field examines does not exist' — only undeterminable, which normally means 'evidence is absent or contradictory.' Recorded as undeterminable here, but that is doing two different jobs across the corpus and a reader cannot tell which from the value alone. monitoring_charts_bound_to_data already has a not_applicable value for a structurally similar situation; groups D and E do not.
- 'interface_kind boundary judgment: rag_helper_project.py''s `if __name__ == ''__main__''` block is a genuinely working script-style interaction (reads a query from an environment variable, prints the answer) but reads as debug/dev scaffolding rather than a documented user-facing interface — the README''s own Interface section describes only the web UI. Included as script_or_notebook per the instruction to record every interface the repo actually offers; flagging because the schema does not distinguish a documented interface from code that happens to function as one.'
- 'query_rewriting boundary judgment: index.py''s normalize_for_text_search() strips stopwords and reformats the query into the keyword-search operator''s syntax. Recorded as NOT the query_rewriting technique (present: false) because it is search-syntax normalization for one retrieval branch, not a reformulation of the question itself. The schema does not state where this boundary falls, and a different extractor could reasonably read it the other way.'
- run_instructions_gap_count item 4 (the interface module's two import statements assuming different import roots) rests on general knowledge of how a directly-run Python script's own directory, rather than the invoking working directory, is placed at the front of the import path — this determines which of the two imports would resolve. This is ordinary language-mechanics knowledge, not domain knowledge, and is load-bearing for that value per the extractor prompt's rule on general programming knowledge; stated explicitly here rather than left implicit.
- document_code_conflicts item 2 and run_instructions_gap_count item 3 both rest on knowing that the package named in the pinned dependency and the package actually imported by the code that calls the same hosted LLM are two distinct, differently-named PyPI packages with different import paths, not two names for the same thing. This is ordinary package-naming knowledge, load-bearing for both values, stated here per the same rule.
- 'broken_reference_count''s fourth item (a documented data directory one level deeper than its actual tracked location) is a softer case than the other three: a reader following the documented path literally finds nothing, but the actually-existing directory one level up has the same name and an attentive reader would likely find it by inference. Counted as broken because the check is what the documented path itself resolves to, not what a reader could work out; flagging the softness rather than silently rounding it away.'
- Two files in the tracked tree are macOS filesystem metadata (.DS_Store, at repo root and under src/) with no bearing on any field above; noted only so their presence in repo_file_count's denominator is not mistaken for an omission.
