extraction_notes:
- 'retrieval_eval_reproducible and llm_eval_reproducible: both marimo notebooks import only one library (marimo, plus one local scoped `from openai import OpenAI` inside a single cell in the LLM-eval notebook). Every other name the files depend on — the test set, the three retriever/reranker classes, the fusion and embedding helpers, the answer generator, the query rewriter, numpy/pandas/matplotlib, and marimo''s own `mo` output handle — is referenced without any import or definition anywhere in the file. Running either file as committed would raise a NameError on its first such reference. This is ordinary Python import-resolution knowledge, not domain knowledge, and it is load-bearing for both `*_reproducible` values and for `headline_numbers_traceable`/`untraceable_number_count`. I read this as `traceable_not_reproducible` rather than `neither` because the retrieval/metric/judge logic is fully and correctly written out, and every undefined name matches an identically-named object that does exist elsewhere in the committed repository — a reader can inspect the intended computation even though nothing is wired to run it. A stricter reading (`neither`) is defensible given how many names are missing and how central they are; this is a genuine judgment call the schema does not fully resolve, since its `traceable_not_reproducible` definition speaks of steps being ''inspectable by reading committed artifacts'' without saying whether cross-file name-matching without any import counts as inspection.'
- 'document_code_conflicts / retrieval_best_approach_shipped: the schema''s own text for group D describes exactly this repository''s retrieval-metrics ceiling issue in the abstract (52% reported vs. 48.1% achievable). I derived the mechanism independently from the evaluation code and the ingestion/test-set source labels rather than from that description, and it checks out arithmetically: 13 of 27 test items (8 + 5) can register a hit under the code''s exact string-match rule, giving a 48.1% ceiling, against a reported Hybrid Hit Rate@5 of 52%. This required counting label distributions across two files by hand, which is ordinary code-reading, not domain knowledge.'
- 'llm_eval_metric_at_ceiling: the ''at ceiling'' call for the second reported metric rests on an arithmetic inference (an average of exactly 5.00 over 27 integer 1-5 scores is only possible if all 27 are 5) rather than on a directly reported per-item breakdown, since no per-item scores are committed. This is ordinary arithmetic, not domain knowledge, but it is load-bearing and worth flagging: the schema''s ceiling rule technically asks for ''at least 95% of scored items,'' and this repository does not commit the per-item data needed to check that directly — only the average, from which the 100% figure is inferred rather than counted.'
- 'run_instructions_gap_count: the one counted gap (API container built and started before ingestion runs, keyword index never rebuilt afterward) required tracing the API''s startup code, not just the documented steps in isolation, consistent with the schema''s instruction to trace each step into the code it invokes. I did not find a second gap on the same walk-through of the documented quick-start; I did not extend the same depth of tracing to the cloud-deployment doc''s steps, since `run_instructions`/`run_instructions_gap_count` appear scoped to the primary run procedure.'
- No schema field was left undeterminable and no value needed the `other` bucket in this extraction.
