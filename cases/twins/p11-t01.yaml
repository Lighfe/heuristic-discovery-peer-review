extraction_notes:
- 'README''s Evaluation Mapping table (README.md:391-409) checks ''Document re-ranking'' as done, but no reranking implementation exists in the repository; only Reciprocal Rank Fusion (RRF) over keyword+vector result lists is present, and that is already the mechanism scored under hybrid_search. Recorded as reranking.present: false and as one document_code_conflict; flagged in case the schema intends RRF fusion itself to count as ''reranking'' in some projects, which would make this a naming-convention question rather than a fabricated claim.'
- .python-version is required by Dockerfile:8 but is listed in .gitignore:3, so it is absent from the pinned commit; a fresh clone following README's documented 'docker compose up -d' step (README.md:346) cannot build the app image. This is a structural, reproducible-on-any-clone gap, not an artifact of this particular checkout.
- 'The Grafana dashboard shown in README''s screenshot (images/dash.PNG) is not reachable by following the documented steps: data/grafana.json is committed but no README step imports it into Grafana, and docker-compose.yaml does not mount or provision it. monitoring_dashboard_provenance is still recorded as committed_definitions because the panel definitions themselves are committed and inspectable; the gap is in run_instructions_gap_count instead.'
- 'Both retrieval and answer evaluation run against a different configuration than what ships: eval notebooks use num_results=10 while the shipped tool hardcodes num_results=5, and the answer-evaluation notebook uses a fixed single-shot search+prompt+llm call while the shipped agentic_rag() lets a tool-calling agent invoke retrieval an unbounded number of times per request. The schema''s *_config_matches_shipped fields capture the top-k difference cleanly; the agentic-vs-fixed-pipeline difference is a larger structural change than a parameter and has no dedicated field beyond ''differs'' — noted here since ''differs'' alone does not convey the size of the gap.'
- interface_framework is recorded as a single free-text string holding both frameworks ('streamlit, flask') since interface_kind's list upgrade (M2) was not mirrored onto interface_framework by this schema revision; a project with two interfaces built on two different frameworks cannot cleanly express that pairing (which framework serves which interface_kind) in one string.
- 'limitations_section is a judgment call here: README has no section literally framed as limitations. ''Future Improvements'' (README.md:426-432) is the nearest analog by content but is framed as a roadmap, not an admission of current shortcomings. Recorded as cosmetic_only under the reading that its content still functions as limitations; if the field is meant to require an explicit limitations framing, absent would be the more literal answer. Either reading yields the same practical consequence (no structural limitation is named), but the field cannot express the framing distinction.'
