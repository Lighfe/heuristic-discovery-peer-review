extraction_notes:
- 'broken_reference_count ambiguity: README links `eval/results/retrieval_eval.md` and `eval/results/rag_eval.md` (README.md:148,156) and mentions `data/golden_set.json` (README.md:73), none of which are tracked in the repository. The repository-layout table explicitly marks `data/` and `eval/results/` as ''(generated)'' (README.md:73-75), which reads as a documented prerequisite rather than a stale or mistaken claim, so these were not counted as broken references. A reader following the link before running anything would still hit a 404, which is the opposite reading; recorded here since the schema''s definition does not distinguish ''explicitly documented as not-yet-generated'' from ''broken''.'
- 'problem_statement scored brief rather than specific: the README''s ''Problem'' section clearly names the topic and gap being addressed, but nowhere names an intended audience (only the generic second-person ''you''); the schema''s own ''specific'' bar requires both a stated question and a stated audience.'
- 'Group H evaluated/measured_effect: eval/evaluate_retrieval.py explicitly compares vector vs. hybrid vs. hybrid_rerank (which would measure hybrid_search''s and reranking''s effect if run), but since no evaluation set or results file is committed, no reported numbers exist anywhere in the repository to read an effect from. Scored evaluated:false and measured_effect:not_measured for all three techniques on the reading that ''evaluated'' requires numbers actually reported (not merely a script capable of reporting them); an extractor reading ''evaluated'' as ''a comparison mechanism exists'' would score hybrid_search/reranking evaluated:true instead. This is a schema-fit ambiguity worth resolving centrally.'
- llm_eval_role_overlap is a single categorical field but the answer-generation step in eval/evaluate_rag.py actually varies per compared variant (two of three variants use the same default model as the question-generator/judge, one uses a larger same-family model); the schema has no field to express per-variant role overlap, so same_family was chosen as the value that covers the full comparison without overclaiming exact identity for every variant.
- retrieval_eval_set_size (60) is read from README's approximate '~60' comment and the generator's default sample-size parameter, not counted from a committed evaluation-set file, since none is committed. It should be read as the documented/default count, not a verified size.
