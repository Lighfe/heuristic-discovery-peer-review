extraction_notes:
- src/tools/config_reviewer.py is a fully implemented third tool (Dockerfile/compose/nginx/Terraform config review, same retrieval backbone) that is never mentioned in README's feature list, never wired into app.py's UI, and not part of group J's fixed artifact checklist — so it neither helps nor hurts any J field, but a reader relying on the README's stated feature set ('Docs Q&A' and 'Explain Log' only) would not know it exists. No field captures an implemented-but-undocumented capability.
- '`headline_numbers_traceable`/`untraceable_number_count` and `document_number_conflicts` were both filled from the same underlying evidence (README''s evaluation table vs. the committed retrieval_report.json), read from two different angles the schema separates (can a committed artifact produce this figure vs. do two committed documents disagree). For this repository the two counts happen to coincide exactly (12 and 12); it is not obvious the schema intends these to always move together, and I could not find guidance on whether a reviewer should treat this as one defect or two independently-creditable ones.'
- '`reranking.measured_effect` had no good enum fit: vector_only_k5 and vector_only_k20_rerank report byte-for-byte identical hit_rate/mrr/ndcg across all 44 questions, i.e. a measured zero effect. `mixed` (defined as metrics disagreeing with each other) does not literally describe this — the metrics agree with each other, just show no change from the intervention. I chose `mixed` as the closest available value and flagged the exact numbers in `basis`, but a `no_effect` or `null` value may be missing from the enum.'
- '`llm_eval_role_overlap`''s three named roles (generator, system-under-test, judge) collapse to two labelled roles here because `llm_eval_question_generator` is `none_committed`; recorded per the schema''s explicit guidance for that case.'
- Group D's `retrieval_eval_relevance_rule` enum offers `passage_level` and `document_level` but the corpus's own chunking (500-token overlapping windows, not aligned to any document substructure like sections or paragraphs) sits awkwardly between the two; I used `passage_level` because match granularity is a chunk, not a whole document, but a corpus with genuinely structured passages (e.g. numbered clauses) would read differently under the same label.
