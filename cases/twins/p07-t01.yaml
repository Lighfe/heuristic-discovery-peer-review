extraction_notes:
- interface_kind is now list[enum] (M2), but interface_framework (group K) remains a single string. This repository ships two interface frameworks at once (Streamlit for web_ui, django-ninja for api), and the single-string field cannot hold both without concatenation. Recording "streamlit, django-ninja" is a workaround, not a value the field's stated shape anticipates; the same asymmetry would recur for any repository offering more than one interface kind built on different frameworks.
- llm_eval_metric_at_ceiling's ceiling rule reads cleanly on the per-item boolean assertion_rates (HitRate, LLMJudge, GenreRagGenreHit, GenreRagFamilyHit, GenreRagResponseHit) but not on the continuous MRR-family scores (MRR, GenreRagGenreMrr, GenreRagFamilyMrr), which have no natural "95% of items at the metric's best value" reading without per-case data this record does not have access to beyond the single committed run. Only the boolean assertion rates were evaluated against the rule.
- monitoring_instrumentation's two values (logged vs traced_on_request_path) do not obviously separate 'writes structured rows to a database synchronously on the request path' from 'emits spans to a tracing backend'. This repository does the former (Conversation/Feedback rows carrying duration/tokens/cost, written inline in request handling) and was recorded as logged, but it is closer to request-path instrumentation than the group F prose's own p02 contrast (OpenTelemetry spans vs nothing) suggests the boundary is meant to be.
- The four dashboard summary tiles plus seven lower panels in docs/monitoring.md's prose table (11 total) match the JSON panel count exactly, so no ambiguity there — noted only because the correspondence had to be checked rather than assumed.
- 'problem_statement''s judgment call: the audience is stated only as "people" wanting to explore musical genres, which reads as no real audience specification rather than a defined persona; recorded as brief rather than specific on that basis, but a different reader could reasonably call the vibes/instruments/dates framing specific enough about the question half alone.'
