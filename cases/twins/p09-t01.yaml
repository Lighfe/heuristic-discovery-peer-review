extraction_notes:
- 'monitoring_instrumentation is a poor fit here: the app writes a full structured interaction record (question, answer, latency, tokens, retriever, refusal) synchronously within the request handler on every call, and that record IS wired to the Grafana dashboard (unlike the schema''s stated ''logged'' case, where nothing is wired to a viewer). It is also not tracing/spans instrumentation like the schema''s ''traced_on_request_path'' example. Recorded as ''logged'' as the closer of the two, but the enum does not cleanly express ''structured per-request logging that a committed dashboard reads''.'
- 'problem_statement''s audience check is again marginal, as flagged as a known schema weakness: README states the topic (grounded handbook Q&A with refusal) clearly but never names an audience directly; ''onboarding a new person'' is a side benefit mentioned in passing, not a stated ''this is for X'' sentence. Scored brief; a different reader could defensibly call it specific.'
- 'retrieval_eval_relevance_rule''s document_level vs passage_level distinction is hard to apply cleanly on this corpus: each committed document is already a single short topic file split into a handful of H2 sections, so ''the matching document'' and ''the matching passage'' are close to the same granularity here. Scored passage_level because the ground truth and the scoring function both key on the section-level chunk_id, not the document id.'
- 'Load-bearing general software knowledge, per the extractor rule: (1) uv includes the ''dev'' dependency-group by default on `uv run`/`uv sync` unless --no-dev is passed, so README''s bare `uv run jupyter lab` instruction does install jupyter/pandas from pyproject.toml''s [dependency-groups].dev without an extra documented step — used to conclude run_instructions_gap_count is not incremented here. (2) Grafana''s provisioning YAML supports `$ENV_VAR` substitution from the container''s environment, so grafana/provisioning/datasources/postgres.yml referencing $POSTGRES_DB/$POSTGRES_USER/$POSTGRES_PASSWORD (which docker-compose.yml sets on the grafana service) is not a broken reference.'
- corpus_domain records the fictional company's business type only (manufacturing), never any real identifying detail; the corpus is stated in README.md as AI-generated for this project.
