extraction_notes:
- interface_framework is typed as a single string, but this repository ships two interface frameworks (FastAPI and Streamlit) for its two interface_kind entries — the same one-value-forces-a-drop problem interface_kind was changed to a list to fix in M2. Recorded as a combined string here; flagging for the same fix to be considered for this field.
- llm_eval_metric_at_ceiling evaluates to true under the M2 95%-of-items rule (Faithfulness at 96.9% and 98.0% for the two compared models), which reads differently from this schema's own illustrative prose elsewhere describing p02's 0.805/0.969 scores as 'below ceiling' — that prose predates the M2 threshold definition. Flagging the discrepancy rather than silently resolving it either way.
- document_code_conflicts is a count, but its counting granularity is not specified the way untraceable_number_count's is ('individual figures, not tables'). The undisclosed-denominator issue recurs identically across four headline figures (Relevance and Faithfulness, for both compared models); recorded as one conflict-pattern rather than four. A stated counting rule for this field would remove this ambiguity.
- 'Group H''s per-technique fields (measured_effect, decision_basis, decision_axes) have no defined value for a technique that is simply absent (present: false) — used not_measured/none/[] as the natural baseline, but the schema does not say this explicitly.'
- LICENSE:3 states an individual's name as copyright holder. Not reproduced anywhere in this record per the anonymity rule; noting the file/line so the owner can decide whether the LICENSE file itself needs handling before any wider publication of extracted material.
- 'retrieval_eval_set_size required a CSV-aware parser rather than a line count: several question fields in data/ground_truth_dataset.csv contain embedded newlines inside quoted values, so `wc -l` overstates the row count (1003-1004) against the true 997 data rows — confirmed against the independently countable 997-entry rag_results_for_eval_*.json files. General software knowledge, load-bearing for this value.'
- 'The judge-call wrapper functions in notebooks/rag.ipynb (cell17, cell19) catch `(json.JSONDecodeError, ValueError, Exception)` — listing Exception, the common base class, alongside two of its own subclasses is redundant, but functionally the effect is a catch-all: any judge-call failure of any kind is converted to a null verdict rather than surfaced. This is why null verdicts appear at all and is load-bearing for llm_eval_metric_at_ceiling''s denominator and for the document_code_conflicts finding above; noted since it required ordinary exception-handling knowledge to read the effect correctly, not domain knowledge.'
- reranking.decision_axes recorded only the axes named in the stated argument text (mrr, latency); hit rate was also measured for the reranked configuration but is not invoked in the stated reasoning, so it was left out per the field's instruction to record the axes actually argued from.
