extraction_notes:
- decision_basis on hybrid_search is a close call. The decision-log entry (D44) grounds keeping hybrid partly in a measured comparison ('never simultaneously worse than both single-method baselines') and partly in a-priori reasons (rubric compliance, a named limitation with a known fix path) — this record follows the decision log and calls it 'measured'. The polished README (retrieval-evaluation.md S9) later frames the same decision as resting on 'stated judgment... not because the evidence compels it', which reads closer to 'argued'. Both framings exist in the repository for the same decision; a reader preferring the README's framing would score this field differently.
- 'llm_eval_metric_at_ceiling required the new M2 ceiling rule to resolve correctly: this repo''s reported metrics are a mix of quality scores (groundedness, maximum-is-best, not clearly at ceiling) and error/refusal rates (pooled leakage and over-refusal, minimum-is-best). Over-refusal is 0.0 for all three prompt variants (0/30 controls refused, i.e. 100% of items at the metric''s own best value), which is exactly the floor-is-best case the schema''s M2 revision was written to handle explicitly, and it alone makes the field true. Evaluated strictly per-metric, never averaged, per the schema''s instruction.'
- 'This repository is unusually deep (212 tracked files, ~3,600 lines of decision log, 30 test modules) and extraction under the time available to one pass was necessarily selective: README, all seven top-level docs/*.md, the core app/ and top of ingest/ modules, docker-compose.yml, Dockerfile, pyproject.toml, Makefile, .env.example, scripts/run_pipeline.py, the monitoring dashboard JSON, and the D44/D46/D55/D56-adjacent sections of docs/decisions/evaluation.md were read in full or targeted; the bulk of docs/decisions/{pipeline,project,serving,labeling}.md (over 1,700 lines) and most of ingest/*.py and scripts/*.py were not read. document_number_conflicts, document_code_conflicts, broken_reference_count and untraceable_number_count are therefore ''none found in the scope read'', not a verified zero over the whole repository — the same caveat the schema itself gives for headline_numbers_traceable.'
- retrieval_eval_approaches_compared (5) follows the project's own count in retrieval-evaluation.md's summary ('Five retrieval approaches were measured'), which treats the three-way embedding-model comparison as one approach. A strict per-configuration count (three embedding models as three separate compared configurations) would give a different number; the schema does not define which granularity 'distinct strategies' means, and this is exactly the kind of case docs/decisions/evaluation.md flags for retrieval_best_approach_shipped's own derivation-rule gap.
- 'problem_statement remains, as the schema itself documents, a coherence-blind field: it credits README for stating audience and question, without checking whether the two cohere. Not re-litigated here.'
- 'The ''basis'' rule change (v2, closing the M1 leak) was followed throughout: no scoreable field''s basis names the corpus subject, the LLM vendor, or any other descriptive-group fact beyond what that specific field checks.'
