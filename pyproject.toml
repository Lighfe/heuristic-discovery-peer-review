[project]
name = "heuristic-discovery-peer-review"
version = "0.1.0"
description = "Discovering better evaluation criteria for zoomcamp capstone projects"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "google-genai==2.17.0",
    "python-dotenv==1.2.2",
    "pyyaml==6.0.3",
]

# huggingface-hub is deliberately NOT a dependency yet. The second model
# family is spent once, at M4, on the final candidate (decision
# `hf-final-only`). Adding the client now would invite using it earlier.

[dependency-groups]
dev = [
    "pytest==9.1.1",
]

[build-system]
requires = ["uv_build>=0.10,<0.11"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "loop"
module-root = ""

[tool.pytest.ini_options]
testpaths = ["tests"]
